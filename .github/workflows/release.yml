name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # ubuntu-22.04: mono-complete + nuget are pre-installed.
    # dotnet SDK added via setup-dotnet for Roslyn (C#10).
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      zip: ${{ steps.pkg.outputs.zip }}
      description: ${{ steps.pkg.outputs.description }}
      website_url: ${{ steps.pkg.outputs.website_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Version from mod.package.props (must match release tag v{Version}) ───
      - name: Resolve release version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' mod.package.props | head -1 | xargs)
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Could not read <Version> from mod.package.props" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG} (${TAG_VERSION}) does not match mod.package.props (${PKG_VERSION}). Tag v${PKG_VERSION} or update <Version>." >&2
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $PKG_VERSION (mod.package.props)"

      # ── Install .NET SDK (Roslyn C#10) ──────────────────────────────────────
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ── Restore NuGet packages ──────────────────────────────────────────────
      #  This pulls, among others:
      #    • Microsoft.NETFramework.ReferenceAssemblies.net48 — official .NET 4.8
      #      BCL + Facades/netstandard.dll; its .targets sets TargetFrameworkRootPath
      #      and disables FrameworkPathOverride so the build uses real MS assemblies.
      #    • JotunnLib — Jotunn.dll + JotunnLib.props (corlib HintPaths)
      #    • ILRepack.Lib.MSBuild.Task — ILRepacker post-build target
      #    • Pfhoenix.Valheim.ModProjectReferences — game DLLs for compile refs
      - name: Restore NuGet packages
        run: |
          nuget restore DrakeModsLibs.csproj -PackagesDirectory packages

      # ── Stage game / BepInEx DLLs from Pfhoenix ─────────────────────────────
      #
      #  Fake "Valheim install" tree:
      #    ci_valheim/valheim_Data/Managed/          ← CorlibPath
      #      publicized_assemblies/                  ← PublicizedAssembliesPath
      #    ci_valheim/BepInEx/core/                  ← BepInExPath
      #
      #  VALHEIM_INSTALL=ci_valheim satisfies JotunnLib's Paths.props HintPaths.
      # ────────────────────────────────────────────────────────────────────────
      - name: Stage game DLLs from Pfhoenix package
        run: |
          PFHOENIX_LIB=$(ls -d packages/Pfhoenix.Valheim.ModProjectReferences.*/lib/net46 2>/dev/null | head -1)
          if [ -z "$PFHOENIX_LIB" ]; then
            echo "ERROR: Pfhoenix package not found" >&2; ls packages/ >&2; exit 1
          fi
          echo "Pfhoenix lib: $PFHOENIX_LIB"

          MANAGED="ci_valheim/valheim_Data/Managed"
          PUBLICIZED="$MANAGED/publicized_assemblies"
          BEPINEX="ci_valheim/BepInEx/core"
          mkdir -p "$MANAGED" "$PUBLICIZED" "$BEPINEX"

          cp "$PFHOENIX_LIB/"*.dll "$MANAGED/"

          cp "$PFHOENIX_LIB/assembly_valheim.dll" "$PUBLICIZED/assembly_valheim_publicized.dll"
          cp "$PFHOENIX_LIB/assembly_utils.dll"   "$PUBLICIZED/assembly_utils_publicized.dll"
          cp "$PFHOENIX_LIB/gui_framework.dll"    "$PUBLICIZED/gui_framework_publicized.dll"

          for src in assembly_googleanalytics assembly_guiutils assembly_lux \
                     assembly_postprocessing assembly_simplemeshcombine \
                     assembly_sunshafts SoftReferenceableAssets; do
            [ -f "$PFHOENIX_LIB/$src.dll" ] && \
              cp "$PFHOENIX_LIB/$src.dll" "$PUBLICIZED/${src}_publicized.dll" || true
          done

          cp "$PFHOENIX_LIB/0Harmony.dll" "$BEPINEX/"
          cp "$PFHOENIX_LIB/bepinex.dll"  "$BEPINEX/BepInEx.dll"

          echo "VALHEIM_INSTALL=$(pwd)/ci_valheim" >> "$GITHUB_ENV"

      # ── Build (Release) ─────────────────────────────────────────────────────
      #  dotnet msbuild: Roslyn from .NET 8 → C# 10.
      #  Directory.Build.props (repo file) reads CI_NET48_FWPATH → sets
      #    TargetFrameworkRootPath to the net48 ref pack (mscorlib + netstandard).
      #  Directory.Build.targets (repo file) reads CI_SKIP_POST_BUILD → no-ops
      #    CopyOutput (Windows path + wrong-case Readme.md) and PackageMod
      #    (PowerShell Compress-Archive). Zip assembled in the next step.
      - name: Build
        env:
          CI_NET48_FWPATH: ${{ github.workspace }}/packages/Microsoft.NETFramework.ReferenceAssemblies.net48.1.0.3/build
          CI_SKIP_POST_BUILD: "true"
        run: |
          CI_ROOT="$(pwd)/ci_valheim"
          MANAGED="$CI_ROOT/valheim_Data/Managed"
          dotnet msbuild DrakeModsLibs.csproj \
            /p:Configuration=Release \
            /p:TargetFrameworkVersion=v4.8 \
            /p:BepInExPath="$CI_ROOT/BepInEx" \
            /p:CorlibPath="$MANAGED" \
            /p:PublicizedAssembliesPath="$MANAGED/publicized_assemblies" \
            /p:Version="${{ steps.ver.outputs.version }}" \
            /t:Build \
            /v:minimal

      # ── Assemble Thunderstore zip (mirrors PackageMod target) ────────────────
      - name: Assemble Thunderstore package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG_DIR="DrakeMods-DrakeModsLibs-${VERSION}"
          ZIP_NAME="DrakeMods-DrakeModsLibs-${VERSION}.zip"
          mkdir -p "$PKG_DIR"
          cp bin/Release/DrakeModsLibs.dll "$PKG_DIR/"
          cp README.md                      "$PKG_DIR/"
          cp icon.png                       "$PKG_DIR/"
          cp CHANGELOG.md                   "$PKG_DIR/"
          dotnet msbuild DrakeModsLibs.csproj \
            /p:Version="$VERSION" \
            /p:ThunderstoreManifestDir="$PKG_DIR" \
            /t:WriteThunderstoreManifest \
            /v:minimal

          DESCRIPTION=$(jq -r '.description' "$PKG_DIR/manifest.json")
          WEBSITE_URL=$(jq -r '.website_url // empty' "$PKG_DIR/manifest.json")

          cd "$PKG_DIR" && zip -r "../$ZIP_NAME" . && cd ..

          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "description<<EOF"
            echo "$DESCRIPTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "website_url=$WEBSITE_URL" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP_NAME"

      # ── Create GitHub Release and attach the zip ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DrakeModsLibs ${{ steps.ver.outputs.version }}"
          prerelease: false
          body: |
            ## DrakeModsLibs v${{ steps.ver.outputs.version }}

            Thunderstore zip attached. CI also publishes to **Thunderstore** then **Hexium**.

            ### Install
            Drop the zip into **r2modman**, **Thunderstore Mod Manager**, or **Gale** via "Import local mod", or extract into:
            ```
            BepInEx/plugins/DrakeMods-DrakeModsLibs/
            ```

            ---
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/CHANGELOG.md) for what's new.
          files: ${{ steps.pkg.outputs.zip }}

      - name: Upload Thunderstore zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderstore-zip
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

  publish-thunderstore:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Download Thunderstore zip
        uses: actions/download-artifact@v4
        with:
          name: thunderstore-zip
          path: dist

      - name: Publish package to Thunderstore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          namespace: DrakeMods
          name: DrakeModsLibs
          version: ${{ needs.build-and-release.outputs.version }}
          description: ${{ needs.build-and-release.outputs.description }}
          community: valheim
          repo: https://thunderstore.io/c/valheim/
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          file: ${{ needs.build-and-release.outputs.zip }}
          path: dist
          website: ${{ needs.build-and-release.outputs.website_url }}
          categories: |
            misc

  publish-hexium:
    needs: [build-and-release, publish-thunderstore]
    runs-on: ubuntu-latest
    steps:
      - name: Download Thunderstore zip
        uses: actions/download-artifact@v4
        with:
          name: thunderstore-zip
          path: dist

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install tcli
        run: dotnet tool install -g tcli

      - name: Publish package to Hexium
        env:
          VERSION: ${{ needs.build-and-release.outputs.version }}
          DESCRIPTION: ${{ needs.build-and-release.outputs.description }}
          WEBSITE_URL: ${{ needs.build-and-release.outputs.website_url }}
          ZIP_NAME: ${{ needs.build-and-release.outputs.zip }}
          HEXIUM_TOKEN: ${{ secrets.HEXIUM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HEXIUM_TOKEN}" ]; then
            echo "::error::HEXIUM_TOKEN secret is not set" >&2
            exit 1
          fi

          # Escape description for TOML double-quoted string
          DESC_ESC=$(printf '%s' "$DESCRIPTION" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read())[1:-1])')
          WEB_ESC=$(printf '%s' "$WEBSITE_URL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read())[1:-1])')

          cat > thunderstore.toml <<EOF
          [config]
          schemaVersion = "0.0.1"

          [package]
          namespace = "DrakeMods"
          name = "DrakeModsLibs"
          versionNumber = "${VERSION}"
          description = "${DESC_ESC}"
          websiteUrl = "${WEB_ESC}"
          containsNsfwContent = false

          [publish]
          repository = "https://valheim.hexium.gg"
          communities = ["valheim"]

          [publish.categories]
          valheim = ["Quality of Life", "Valheim 1.0"]
          EOF

          # Strip leading indentation from heredoc
          sed -i 's/^          //' thunderstore.toml
          cat thunderstore.toml

          export PATH="$PATH:$HOME/.dotnet/tools"
          tcli publish \
            --config-path thunderstore.toml \
            --file "dist/${ZIP_NAME}" \
            --token "${HEXIUM_TOKEN}"
